<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>מיקמק אונליין רשת</title><style>body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;user-select:none;}#game-window{position:relative;width:100%;height:100%;cursor:crosshair;transition:background 0.8s ease;}.world-main{background:linear-gradient(to bottom,#7ed6df 0%,#7ed6df 40%,#f1c40f 40%,#f1c40f 42%,#6ab04c 42%,#6ab04c 100%);}.world-magic{background:linear-gradient(to bottom,#2c1a4d 0%,#2c1a4d 40%,#9b59b6 40%,#9b59b6 42%,#1e1135 42%,#1e1135 100%)!important;}.castle{position:absolute;bottom:58%;left:50%;transform:translateX(-50%);width:160px;height:120px;background-color:#f9ca24;border-radius:10px 10px 0 0;}.castle-roof{position:absolute;top:-60px;left:50%;transform:translateX(-50%);border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:60px solid #eb4d4b;}.mushroom{display:none;position:absolute;bottom:45%;width:30px;height:40px;animation:bounce 0.6s infinite alternate;}.mushroom-cap{width:40px;height:25px;background:#e74c3c;border-radius:20px 20px 0 0;}.mushroom-stem{width:15px;height:20px;background:#fff;margin:0 auto;}@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-10px);}}.tree{position:absolute;bottom:50%;width:40px;height:80px;}.tree-trunk{position:absolute;bottom:0;left:15px;width:10px;height:40px;background-color:#5d4037;}.tree-leaves{position:absolute;top:0;width:40px;height:50px;background-color:#2e7d32;border-radius:50%;transition:background 0.5s;}#world-map-btn,#shop-btn{position:absolute;top:20px;width:90px;height:90px;border:4px solid #fff;border-radius:15px;cursor:pointer;z-index:100;color:white;font-weight:bold;text-align:center;font-size:14px;padding-top:15px;box-sizing:border-box;}#world-map-btn{right:20px;background:radial-gradient(circle,#f39c12,#d35400);}#shop-btn{left:20px;background:radial-gradient(circle,#3498db,#2980b9);}.ui-panel{position:absolute;top:20px;left:50%;transform:translateX(-50%);background-color:rgba(0,0,0,0.75);color:white;padding:12px 25px;border-radius:30px;font-size:18px;z-index:100;pointer-events:none;}#chat-container{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px;background:rgba(0,0,0,0.6);padding:10px;border-radius:20px;}#chat-input{padding:8px 15px;border-radius:15px;border:none;font-size:16px;outline:none;width:250px;}#chat-btn{padding:8px 15px;border-radius:15px;border:none;background:#2ecc71;color:white;font-weight:bold;cursor:pointer;}.player-avatar{position:absolute;width:50px;height:60px;border-radius:15px;transform:translate(-50%,50%);transition:left 0.8s ease-out,bottom 0.8s ease-out;z-index:10;}.player-avatar::before{content:'';position:absolute;top:15px;left:10px;width:8px;height:8px;background:white;border-radius:50%;box-shadow:22px 0 0 white;}.player-avatar::after{content:'';position:absolute;top:18px;left:13px;width:3px;height:3px;background:black;border-radius:50%;box-shadow:22px 0 0 black;}#wizard-hat{display:none;position:absolute;top:-35px;left:50%;transform:translateX(-50%);border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:40px solid #2980b9;z-index:11;}#wizard-hat::after{content:'';position:absolute;bottom:-40px;left:-25px;width:50px;height:5px;background:#1abc9c;border-radius:5px;}.speech-bubble{display:none;position:absolute;top:-85px;left:50%;transform:translateX(-50%);background:white;color:black;padding:6px 12px;border-radius:10px;font-size:14px;font-weight:bold;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,0.2);border:2px solid #333;z-index:12;}.speech-bubble::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border-width:10px 10px 0;border-style:solid;border-color:white transparent;display:block;width:0;}.coin{position:absolute;width:25px;height:25px;background:#ffd700;border-radius:50%;border:2px solid #daa520;animation:spin 1s infinite linear;z-index:5;}@keyframes spin{0%{transform:scaleX(1);}50%{transform:scaleX(0);}100%{transform:scaleX(1);}}</style>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
</head><body><div id="game-window" class="world-main"><div class="ui-panel" id="status-text">🌐 עולם רשת פתוח | מטבעות: <span id="coin-score">0</span></div><div id="world-map-btn" onclick="toggleWorld(event)">🗺️<br>מפה</div><div id="shop-btn" onclick="openShop(event)">🛍️<br>חנות (3)</div><div class="castle" id="main-castle"><div class="castle-roof"></div></div><div class="mushroom" id="mush1" style="left:30%;"><div class="mushroom-cap"></div><div class="mushroom-stem"></div></div><div class="mushroom" id="mush2" style="right:30%;animation-delay:0.3s;"><div class="mushroom-cap" style="background:#f1c40f;"></div><div class="mushroom-stem"></div></div><div class="tree" style="left:10%;"><div class="tree-leaves" id="leaves1"></div><div class="tree-trunk"></div></div><div class="tree" style="right:10%;"><div class="tree-leaves" id="leaves2"></div><div class="tree-trunk"></div></div><div class="coin" style="left:25%;bottom:30%;"></div><div class="coin" style="left:70%;bottom:25%;"></div><div class="coin" style="left:50%;bottom:45%;"></div><div id="players-container"></div><div id="chat-container" onclick="event.stopPropagation();"><input type="text" id="chat-input" placeholder="הקלידי הודעה..." maxlength="40"><button id="chat-btn" onclick="sendSpeech()">שלח</button></div></div>
<script>
const firebaseConfig = { databaseURL: "https://firebaseio.com" };
firebase.initializeApp(firebaseConfig);const database = firebase.database();
const gameWindow=document.getElementById('game-window');const playersContainer=document.getElementById('players-container');const chatInput=document.getElementById('chat-input');const statusText=document.getElementById('status-text');
let currentWorld='main';let coinsCollected=0;
const myId = 'player_' + Math.floor(Math.random() * 1000000);
const myColor = '#' + Math.floor(Math.random()*16777215).toString(16);
const myRef = database.ref('players/' + myId);
myRef.set({ id: myId, x: 50, y: 20, color: myColor, world: currentWorld, hat: false, chat: "" });
myRef.onDisconnect().remove();
gameWindow.addEventListener('click',(event)=>{
    const clickX=(event.clientX/window.innerWidth)*100;const clickY=100-((event.clientY/window.innerHeight)*100);
    if(clickY>58||clickY<12)return;
    myRef.update({ x: clickX, y: clickY });
    setTimeout(checkCoinCollision, 400);
});
function sendSpeech(){const text=chatInput.value.trim();if(!text)return;myRef.update({ chat: text });chatInput.value='';setTimeout(() => { myRef.update({ chat: "" }); }, 4000);}
chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')sendSpeech();});
function openShop(event){event.stopPropagation();if(coinsCollected>=3){coinsCollected-=3;document.getElementById('coin-score').innerText=coinsCollected;myRef.update({ hat: true });alert("🎩 תתחדשי! קנית כובע קוסמים!");}else{alert("❌ צריך 3 מטבעות בשביל כובע!");}}
function toggleWorld(event){
    event.stopPropagation();const castle=document.getElementById('main-castle');const mush1=document.getElementById('mush1');const mush2=document.getElementById('mush2');const l1=document.getElementById('leaves1');const l2=document.getElementById('leaves2');
    if(currentWorld==='main'){currentWorld='magic';gameWindow.className='world-magic';castle.style.display='none';mush1.style.display='block';mush2.style.display='block';l1.style.backgroundColor='#00ecff';l2.style.backgroundColor='#ff0076';}
    else{currentWorld='main';gameWindow.className='world-main';castle.style.display='block';mush1.style.display='none';mush2.style.display='none';l1.style.backgroundColor='#2e7d32';l2.style.backgroundColor='#2e7d32';}
    myRef.update({ world: currentWorld, x: 50, y: 20 });
    statusText.innerHTML=(currentWorld==='main'?"🌟 עולם ראשי":"🔮 יער הקסמים")+" | מטבעות: <span id='coin-score'>"+coinsCollected+"</span>";
}
database.ref('players').on('value', (snapshot) => {
    const players = snapshot.val() || {};
    document.querySelectorAll('.player-avatar').forEach(el => { if (!players[el.id]) el.remove(); });
    Object.keys(players).forEach(id => {
        const p = players[id];let el = document.getElementById(id);
        if (!el) { el = document.createElement('div');el.className='player-avatar';el.id=id;el.innerHTML='<div id="wizard-hat"></div><div class="speech-bubble"></div>';playersContainer.appendChild(el); }
        el.style.backgroundColor = p.color;el.style.left = p.x + '%';el.style.bottom = p.y + '%';
        el.querySelector('#wizard-hat').style.display = p.hat ? 'block' : 'none';
        const bubble = el.querySelector('.speech-bubble');
        if (p.chat) { bubble.innerText = p.chat; bubble.style.display = 'block'; } else { bubble.style.display = 'none'; }
        el.style.display = (p.world === currentWorld) ? 'block' : 'none';
    });
});
function checkCoinCollision(){
    const el = document.getElementById(myId);if(!el)return;const pRect = el.getBoundingClientRect();
    document.querySelectorAll('.coin').forEach(coin=>{
        if(coin.style.display==='none')return;const cRect = coin.getBoundingClientRect();
        if(!(pRect.right<cRect.left||pRect.left>cRect.right||pRect.bottom<cRect.top||pRect.top>cRect.bottom)){
            coin.style.display='none';coinsCollected++;document.getElementById('coin-score').innerText=coinsCollected;
            setTimeout(()=>{coin.style.left=(Math.random()*80+10)+'%';coin.style.bottom=(Math.random()*30+15)+'%';coin.style.display='block';},3000);
        }
    });
}
</script></body></html>
